[project]
name = "roadwatcher-cv"
version = "0.1.0"
description = "RoadWatcher local ONNX video scanning sidecar"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.4,<3",
  "onnxruntime>=1.27,<2",
  "opencv-python-headless>=4.13,<6",
]

[project.scripts]
roadwatcher-cv = "roadwatcher_cv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
