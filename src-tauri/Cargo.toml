[package]
name = "roadwatcher"
version = "0.1.0"
description = "RoadWatcher local evidence workstation"
authors = ["RoadWatcher contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "roadwatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
